<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoLM — True Backpropagation & Auditable Sandbox</title>
<style>
  :root { --bg: #06080d; --card: #0c1019; --card-border: #182030; --accent: #10b981; --text: #f1f5f9; --muted: #64748b; --input-bg: #080b12; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  button { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; margin-right: 8px; }
  button:disabled { opacity: 0.35; }
  textarea, input, .output { width: 100%; background: var(--input-bg); color: var(--text); border: 1px solid var(--card-border); border-radius: 6px; padding: 8px; font-family: monospace; }
  textarea { height: 70px; }
  .output { min-height: 50px; white-space: pre-wrap; }
  .stats { color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<h1>NanoLM — True Analytical Backprop</h1>
<p style="color:#64748b">Gradientes analíticos completos (atenção + MLP + embeddings). GradCheck por diferença central.</p>
<div class="card">
  <textarea id="trainText">A IA pode aprender. A IA pode errar. A IA pode ajudar.</textarea>
  <div style="margin-top:10px">
    <button onclick="initModel()">Inicializar</button>
    <button onclick="trainSteps(1)" id="trainBtn" disabled>1 Época</button>
    <button onclick="trainSteps(10)" id="train10Btn" disabled>10 Épocas</button>
    <button onclick="runGradCheck()" id="gradCheckBtn" disabled>GradCheck</button>
  </div>
  <div class="stats">Vocab: <b id="vocabSize">-</b> · Época: <b id="epoch">0</b> · Loss: <b id="loss">-</b> · GradCheck: <b id="gradCheckRes">-</b></div>
  <pre id="gradCheckDetails" class="output" style="margin-top:8px">Aguardando.</pre>
</div>
<div class="card">
  <input id="prompt" value="A IA pode">
  <button onclick="generateToken()" id="genBtn" disabled>Gerar Token</button>
  <div class="output" id="generated" style="margin-top:8px">A IA pode</div>
</div>
<div class="card"><div id="auditLog" class="output">Log pronto.</div></div>
<script>
let model=null, charToId=new Map(), idToChar=[], logChain=[], logQueue=Promise.resolve();
const genesisHash='0'.repeat(64);
async function sha256(m){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function appendLog(e,d){const op=logQueue.then(async()=>{const p=logChain.length?logChain.at(-1).hash:genesisHash,t=new Date().toISOString(),r=`${p}|${t}|${e}|${JSON.stringify(d)}`,h=await sha256(r);logChain.push({prevHash:p,timestamp:t,event:e,data:d,hash:h});document.getElementById('auditLog').innerHTML=logChain.slice(-5).reverse().map(x=>`[${x.event}] ${JSON.stringify(x.data)}`).join('<br>');});logQueue=op.catch(()=>{});return op;}
function randn(){return(Math.random()*2-1)*0.1}function zeros(n){return Array(n).fill(0)}function mat(r,c){return Array.from({length:r},()=>Array.from({length:c},randn))}
function softmax(a,t=1){const s=a.map(x=>x/Math.max(t,0.01)),m=Math.max(...s),e=s.map(x=>Math.exp(x-m)),sum=e.reduce((a,b)=>a+b,0);return e.map(x=>x/(sum||1))}
function matMulVec(W,x){return W.map(r=>r.reduce((s,w,i)=>s+w*x[i],0))}function matTransposeMulVec(W,g){const o=zeros(W[0].length);for(let i=0;i<W.length;i++)for(let j=0;j<o.length;j++)o[j]+=W[i][j]*g[i];return o}
function vectorNorm(a){return Math.sqrt(a.reduce((s,v)=>s+v*v,0))}function crossEntropyFromLogits(l,t){const m=Math.max(...l),lse=m+Math.log(l.reduce((s,v)=>s+Math.exp(v-m),0));return lse-l[t]}
async function initModel(){await logQueue;const text=document.getElementById('trainText').value,chars=[...new Set(text)];idToChar=chars;charToId=new Map(chars.map((c,i)=>[c,i]));const V=chars.length,D=16,H=2,Dh=D/H,Dmlp=D*2;model={V,D,H,Dh,Dmlp,E:mat(V,D),pos:mat(64,D),heads:Array.from({length:H},()=>({Wq:mat(Dh,D),Wk:mat(Dh,D),Wv:mat(Dh,D)})),Wo:mat(D,D),W1:mat(Dmlp,D),b1:zeros(Dmlp),W2:mat(D,Dmlp),b2:zeros(D),Wout:mat(V,D),bout:zeros(V),epoch:0,loss:0};document.getElementById('vocabSize').textContent=V;['trainBtn','train10Btn','gradCheckBtn','genBtn'].forEach(id=>document.getElementById(id).disabled=false);logChain=[];logQueue=Promise.resolve();await appendLog('INIT',{V});}
function forwardPass(ids){const T=ids.length,{D,H,Dh}=model;const x=ids.map((id,t)=>{const e=model.E[id].slice();for(let j=0;j<D;j++)e[j]+=model.pos[t%64][j];return e});const cacheHeads=[],headOutputs=[];for(let h=0;h<H;h++){const{Wq,Wk,Wv}=model.heads[h];const Q=x.map(v=>matMulVec(Wq,v)),K=x.map(v=>matMulVec(Wk,v)),Vv=x.map(v=>matMulVec(Wv,v));const attWeights=[],headOut=x.map(()=>zeros(Dh));for(let t=0;t<T;t++){const scores=[];for(let s=0;s<=t;s++){let sc=0;for(let j=0;j<Dh;j++)sc+=Q[t][j]*K[s][j];scores.push(sc/Math.sqrt(Dh))}const w=softmax(scores);attWeights.push(w);for(let s=0;s<=t;s++)for(let j=0;j<Dh;j++)headOut[t][j]+=w[s]*Vv[s][j]}cacheHeads.push({Q,K,Vv,attWeights});headOutputs.push(headOut)}const concatAtt=[];for(let t=0;t<T;t++){const v=zeros(D);for(let h=0;h<H;h++)for(let j=0;j<Dh;j++)v[h*Dh+j]=headOutputs[h][t][j];concatAtt.push(v)}const projAtt=concatAtt.map(v=>matMulVec(model.Wo,v));const residual1=x.map((v,t)=>v.map((val,j)=>val+projAtt[t][j]));const mlpHiddenPre=residual1.map(v=>matMulVec(model.W1,v).map((val,j)=>val+model.b1[j]));const mlpHidden=mlpHiddenPre.map(h=>h.map(v=>Math.max(0,v)));const mlpOut=mlpHidden.map(h=>matMulVec(model.W2,h).map((val,j)=>val+model.b2[j]));const residual2=residual1.map((v,t)=>v.map((val,j)=>val+mlpOut[t][j]));const logits=residual2.map(h=>matMulVec(model.Wout,h).map((val,j)=>val+model.bout[j]));return{ids,x,cacheHeads,concatAtt,residual1,mlpHiddenPre,mlpHidden,residual2,logits,lastNorms:{embed:vectorNorm(x[T-1]),attRes:vectorNorm(residual1[T-1]),mlpRes:vectorNorm(residual2[T-1]),logits:vectorNorm(logits[T-1])}}}
function backwardAttentionHead(x,headCache,dHeadOut,headWeights){const T=x.length,Dh=model.Dh,{Q,K,Vv,attWeights}=headCache,{Wq,Wk,Wv}=headWeights;const dQ=Array.from({length:T},()=>zeros(Dh)),dK=Array.from({length:T},()=>zeros(Dh)),dV=Array.from({length:T},()=>zeros(Dh));const gradWq=Array.from({length:Dh},()=>zeros(model.D)),gradWk=Array.from({length:Dh},()=>zeros(model.D)),gradWv=Array.from({length:Dh},()=>zeros(model.D));const scale=Math.sqrt(Dh);for(let t=0;t<T;t++){const attention=attWeights[t],dAttention=zeros(t+1);for(let s=0;s<=t;s++)for(let j=0;j<Dh;j++){dV[s][j]+=attention[s]*dHeadOut[t][j];dAttention[s]+=dHeadOut[t][j]*Vv[s][j]}let weightedMean=0;for(let s=0;s<=t;s++)weightedMean+=attention[s]*dAttention[s];for(let s=0;s<=t;s++){const dScore=attention[s]*(dAttention[s]-weightedMean)/scale;for(let j=0;j<Dh;j++){dQ[t][j]+=dScore*K[s][j];dK[s][j]+=dScore*Q[t][j]}}}const dX=Array.from({length:T},()=>zeros(model.D));for(let t=0;t<T;t++)for(let r=0;r<Dh;r++)for(let c=0;c<model.D;c++){gradWq[r][c]+=dQ[t][r]*x[t][c];gradWk[r][c]+=dK[t][r]*x[t][c];gradWv[r][c]+=dV[t][r]*x[t][c];dX[t][c]+=Wq[r][c]*dQ[t][r]+Wk[r][c]*dK[t][r]+Wv[r][c]*dV[t][r]}return{gradWq,gradWk,gradWv,dX}}
function computeGradients(ids){if(!model||ids.length<2)return null;let totalLoss=0,count=0;const gradE=Array.from({length:model.V},()=>zeros(model.D)),gradPos=Array.from({length:64},()=>zeros(model.D)),gradWout=Array.from({length:model.V},()=>zeros(model.D)),gradBout=zeros(model.V),gradW2=Array.from({length:model.D},()=>zeros(model.Dmlp)),gradB2=zeros(model.D),gradW1=Array.from({length:model.Dmlp},()=>zeros(model.D)),gradB1=zeros(model.Dmlp),gradWo=Array.from({length:model.D},()=>zeros(model.D)),gradHeads=model.heads.map(()=>({Wq:Array.from({length:model.Dh},()=>zeros(model.D)),Wk:Array.from({length:model.Dh},()=>zeros(model.D)),Wv:Array.from({length:model.Dh},()=>zeros(model.D))}));for(let t=1;t<ids.length;t++){const subIds=ids.slice(0,t),target=ids[t],cache=forwardPass(subIds),T=subIds.length,last=T-1;const probs=softmax(cache.logits[last]);totalLoss+=crossEntropyFromLogits(cache.logits[last],target);count++;const dLogits=probs.map((p,v)=>p-(v===target?1:0));const lastRes2=cache.residual2[last];for(let v=0;v<model.V;v++){gradBout[v]+=dLogits[v];for(let j=0;j<model.D;j++)gradWout[v][j]+=dLogits[v]*lastRes2[j]}const dResidual2=matTransposeMulVec(model.Wout,dLogits);const dResidual1=dResidual2.slice();const mlpHid=cache.mlpHidden[last];for(let r=0;r<model.D;r++){gradB2[r]+=dResidual2[r];for(let c=0;c<model.Dmlp;c++)gradW2[r][c]+=dResidual2[r]*mlpHid[c]}const dMlpHid=matTransposeMulVec(model.W2,dResidual2);const dMlpHidPre=dMlpHid.map((val,j)=>cache.mlpHiddenPre[last][j]>0?val:0);for(let r=0;r<model.Dmlp;r++){gradB1[r]+=dMlpHidPre[r];for(let c=0;c<model.D;c++)gradW1[r][c]+=dMlpHidPre[r]*cache.residual1[last][c]}const dRes1FromMlp=matTransposeMulVec(model.W1,dMlpHidPre);for(let j=0;j<model.D;j++)dResidual1[j]+=dRes1FromMlp[j];const concatLast=cache.concatAtt[last];for(let r=0;r<model.D;r++)for(let c=0;c<model.D;c++)gradWo[r][c]+=dResidual1[r]*concatLast[c];const dConcat=Array.from({length:T},()=>zeros(model.D)),dProjAtt=Array.from({length:T},()=>zeros(model.D));for(let j=0;j<model.D;j++)dProjAtt[last][j]=dResidual1[j];for(let t2=0;t2<T;t2++)dConcat[t2]=matTransposeMulVec(model.Wo,dProjAtt[t2]);const dX=Array.from({length:T},()=>zeros(model.D));for(let h=0;h<model.H;h++){const dh=Array.from({length:T},()=>zeros(model.Dh));for(let t2=0;t2<T;t2++)for(let j=0;j<model.Dh;j++)dh[t2][j]=dConcat[t2][h*model.Dh+j];const bw=backwardAttentionHead(cache.x,cache.cacheHeads[h],dh,model.heads[h]);for(let r=0;r<model.Dh;r++)for(let c=0;c<model.D;c++){gradHeads[h].Wq[r][c]+=bw.gradWq[r][c];gradHeads[h].Wk[r][c]+=bw.gradWk[r][c];gradHeads[h].Wv[r][c]+=bw.gradWv[r][c]}for(let t2=0;t2<T;t2++)for(let j=0;j<model.D;j++)dX[t2][j]+=bw.dX[t2][j]}for(let t2=0;t2<T;t2++)for(let j=0;j<model.D;j++){gradE[subIds[t2]][j]+=dX[t2][j];gradPos[t2%64][j]+=dX[t2][j]}for(let j=0;j<model.D;j++){gradE[subIds[last]][j]+=dResidual1[j];gradPos[last%64][j]+=dResidual1[j]}}return{loss:totalLoss/(count||1),count,gradE,gradPos,gradWout,gradBout,gradW2,gradB2,gradW1,gradB1,gradWo,gradHeads}}
function trainStepAnalytical(){if(!model)return;const ids=[...document.getElementById('trainText').value].map(c=>charToId.get(c)).filter(id=>id!==undefined);const g=computeGradients(ids);if(!g)return;const lr=0.02,n=g.count||1;for(let v=0;v<model.V;v++){model.bout[v]-=(lr/n)*g.gradBout[v];for(let j=0;j<model.D;j++){model.Wout[v][j]-=(lr/n)*g.gradWout[v][j];model.E[v][j]-=(lr/n)*g.gradE[v][j]}}for(let t=0;t<64;t++)for(let j=0;j<model.D;j++)model.pos[t][j]-=(lr/n)*g.gradPos[t][j];for(let r=0;r<model.D;r++){model.b2[r]-=(lr/n)*g.gradB2[r];for(let c=0;c<model.Dmlp;c++)model.W2[r][c]-=(lr/n)*g.gradW2[r][c];for(let c=0;c<model.D;c++)model.Wo[r][c]-=(lr/n)*g.gradWo[r][c]}for(let r=0;r<model.Dmlp;r++){model.b1[r]-=(lr/n)*g.gradB1[r];for(let c=0;c<model.D;c++)model.W1[r][c]-=(lr/n)*g.gradW1[r][c]}for(let h=0;h<model.H;h++)for(let r=0;r<model.Dh;r++)for(let c=0;c<model.D;c++){model.heads[h].Wq[r][c]-=(lr/n)*g.gradHeads[h].Wq[r][c];model.heads[h].Wk[r][c]-=(lr/n)*g.gradHeads[h].Wk[r][c];model.heads[h].Wv[r][c]-=(lr/n)*g.gradHeads[h].Wv[r][c]}model.epoch++;model.loss=g.loss;document.getElementById('epoch').textContent=model.epoch;document.getElementById('loss').textContent=model.loss.toFixed(4)}
async function trainSteps(n){for(let i=0;i<n;i++)trainStepAnalytical();await appendLog('TRAIN',{epoch:model.epoch,loss:model.loss})}
function lossForIds(ids){let total=0,count=0;for(let t=1;t<ids.length;t++){const cache=forwardPass(ids.slice(0,t));total+=crossEntropyFromLogits(cache.logits[t-1],ids[t]);count++}return total/(count||1)}
function runGradCheck(){if(!model)return;const eps=1e-4,absTol=2e-5,relTol=2e-3;const ids=[...document.getElementById('trainText').value].map(c=>charToId.get(c)).filter(id=>id!==undefined).slice(0,9);const gradients=computeGradients(ids);if(!gradients)return;const params=[['E[0][0]',()=>model.E[0][0],v=>model.E[0][0]=v,()=>gradients.gradE[0][0]],['heads[0].Wq[0][0]',()=>model.heads[0].Wq[0][0],v=>model.heads[0].Wq[0][0]=v,()=>gradients.gradHeads[0].Wq[0][0]],['Wout[0][0]',()=>model.Wout[0][0],v=>model.Wout[0][0]=v,()=>gradients.gradWout[0][0]],['bout[0]',()=>model.bout[0],v=>model.bout[0]=v,()=>gradients.gradBout[0]]];const results=[];for(const[name,get,set,analyticRaw]of params){const original=get();set(original+eps);const plus=lossForIds(ids);set(original-eps);const minus=lossForIds(ids);set(original);const analytic=analyticRaw()/gradients.count;const numerical=(plus-minus)/(2*eps);const absError=Math.abs(analytic-numerical);const relError=absError/Math.max(1e-12,Math.abs(analytic),Math.abs(numerical));const status=(absError<=absTol||relError<=relTol)?'PASS':'FAIL';results.push({name,status,reason:`abs=${absError.toExponential(2)} rel=${relError.toExponential(2)}`})}const counts=results.reduce((o,r)=>{o[r.status]=(o[r.status]||0)+1;return o},{PASS:0,FAIL:0});document.getElementById('gradCheckRes').textContent=`${counts.PASS} PASS · ${counts.FAIL} FAIL`;document.getElementById('gradCheckDetails').textContent=results.map(r=>`${r.status} ${r.name} ${r.reason}`).join('\n');appendLog('GRADCHECK',{counts});return{counts,results}}
function generateToken(){if(!model)return;const prompt=document.getElementById('prompt').value||document.getElementById('generated').textContent;const ids=[...prompt].map(c=>charToId.get(c)).filter(id=>id!==undefined);if(!ids.length)return;const cache=forwardPass(ids);const logits=cache.logits.at(-1);const probs=softmax(logits,0.7);let r=Math.random(),cum=0,next=0;for(let i=0;i<probs.length;i++){cum+=probs[i];if(r<=cum){next=i;break}}const ch=idToChar[next]||'?';const newText=prompt+ch;document.getElementById('generated').textContent=newText;document.getElementById('prompt').value=newText;appendLog('GEN',{char:ch})}
window.onload=initModel;
</script>
</body>
</html>
